[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dupesweep"
version = "1.0.1"
description = "Find exact duplicates and edited versions of photos, safely (Windows, macOS, Linux)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6", "Pillow>=12.3.0", "pillow-heif>=1.8.1", "PySide6-Essentials>=6.8.3,<6.9", "Send2Trash>=2.2.0"]

[project.urls]
Homepage = "https://github.com/devid9602/DupeSweep"
Issues = "https://github.com/devid9602/DupeSweep/issues"
Changelog = "https://github.com/devid9602/DupeSweep/blob/main/CHANGELOG.md"

[project.optional-dependencies]
raw = ["rawpy>=0.21"]
dev = ["pytest>=9.2.0", "scikit-image>=0.25.2", "scikit-learn>=1.7.2", "pip-audit>=2.10.1"]
build = ["pyinstaller>=6.22.3"]

[project.gui-scripts]
dupesweep = "dupesweep.gui.app:main"

[tool.setuptools.packages.find]
include = ["dupesweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
