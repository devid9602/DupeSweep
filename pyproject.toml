[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dupesweep"
version = "1.0.1"
description = "Find exact duplicates and edited versions of photos, safely (Windows, macOS, Linux)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "Pillow>=10.3", "pillow-heif>=0.18", "PySide6-Essentials>=6.7,<6.9", "Send2Trash>=1.8"]

[project.urls]
Homepage = "https://github.com/devid9602/DupeSweep"
Issues = "https://github.com/devid9602/DupeSweep/issues"
Changelog = "https://github.com/devid9602/DupeSweep/blob/main/CHANGELOG.md"

[project.optional-dependencies]
raw = ["rawpy>=0.21"]
dev = ["pytest>=8", "scikit-image>=0.24", "scikit-learn>=1.5", "pip-audit>=2.7"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
dupesweep = "dupesweep.gui.app:main"

[tool.setuptools.packages.find]
include = ["dupesweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
