version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions up to date (one grouped pull request per week).
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Watches the dependency ranges. After merging, regenerate the hash locks with tools/update_locks.sh.
  - package-ecosystem: pip
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Qt 6.9 and later need macOS 13+, and DupeSweep supports macOS 12 Monterey.
      - dependency-name: "pyside6*"
        versions: [">=6.9"]
      - dependency-name: "shiboken6"
        versions: [">=6.9"]
      # rawpy has no Intel-Mac builds after 0.25.1, so its Intel-Mac pin must stay. Update rawpy by hand.
      - dependency-name: "rawpy"
    commit-message:
      prefix: deps
