name: Release builds

# Runs when a version tag (v1.2.3) is created. Only the repository owner can create
# those tags (tag ruleset), and publishing waits for approval in the "release" environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # trial build without publishing

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows-x64 }
          - { os: macos-15-intel, name: macOS-Intel, mac_platform: macosx_12_0_x86_64 }
          - { os: macos-latest, name: macOS-AppleSilicon, mac_platform: macosx_12_0_arm64 }
          - { os: ubuntu-22.04, name: Linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - name: Install build tools (exact versions, hash-checked)
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Install app dependencies (exact versions, hash-checked)
        if: runner.os != 'macOS'
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install app dependencies built for macOS 12 (exact versions, hash-checked)
        if: runner.os == 'macOS'
        env:
          MAC_PLATFORM: ${{ matrix.mac_platform }}
        run: |
          python -m pip download --require-hashes --only-binary=:all: --platform "$MAC_PLATFORM" \
            --python-version 3.12 --implementation cp --abi cp312 -d mac-wheels -r requirements.lock
          python -m pip install --require-hashes --no-index --find-links mac-wheels -r requirements.lock
      - name: Build
        shell: bash
        run: |
          ICON=assets/icon.ico
          if [ "$RUNNER_OS" = "macOS" ]; then ICON=assets/icon.icns; fi
          pyinstaller --noconfirm --clean --windowed --name DupeSweep --icon "$ICON" \
            --osx-bundle-identifier io.github.devid9602.dupesweep \
            --add-data "assets:assets" --collect-all pillow_heif --collect-submodules rawpy \
            --exclude-module cv2 --exclude-module scipy --exclude-module pandas --exclude-module matplotlib \
            --exclude-module skimage --exclude-module sklearn --exclude-module imageio --exclude-module imageio_ffmpeg \
            --exclude-module tkinter --exclude-module IPython --exclude-module pytest run_dupesweep.py
      - name: Check the Mac app runs on macOS 12 Monterey or later
        if: runner.os == 'macOS'
        run: |
          plutil -replace LSMinimumSystemVersion -string 12.0 dist/DupeSweep.app/Contents/Info.plist
          codesign --force --deep --sign - dist/DupeSweep.app
          python tools/check_macos_min.py dist/DupeSweep.app 12.0
      - name: Check that the packaged app starts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then dist/DupeSweep.app/Contents/MacOS/DupeSweep --smoke
          elif [ "$RUNNER_OS" = "Windows" ]; then dist/DupeSweep/DupeSweep.exe --smoke
          else QT_QPA_PLATFORM=offscreen dist/DupeSweep/DupeSweep --smoke; fi
      - name: Package
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent DupeSweep.app "DupeSweep-$NAME.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then 7z a "DupeSweep-$NAME.zip" DupeSweep
          else tar czf "DupeSweep-$NAME.tar.gz" DupeSweep; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DupeSweep-${{ matrix.name }}
          path: |
            dist/DupeSweep-*.zip
            dist/DupeSweep-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release          # waits for the owner's approval
    permissions:
      contents: write             # upload files to the GitHub release
      id-token: write             # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Only publish tags that point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main – refusing to publish"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: DupeSweep-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum DupeSweep-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Signed build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/DupeSweep-*
      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "DupeSweep ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/DupeSweep-* dist/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
